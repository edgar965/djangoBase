[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djangobase"
version = "0.0.23"
description = "Wiederverwendbare Django-Infrastruktur: Hilfe (Versionen/Logs/Tests/Jobs), Sidebar-Layout (bis 3 Ebenen), Logging."
requires-python = ">=3.10"
# Pillow ist PFLICHT, nicht optional: `Provider.logo` und `Teilnehmer.avatar`
# sind ImageFields, und Django bricht ohne Pillow schon bei `manage.py check`
# ab (fields.E210) - das Projekt startet gar nicht erst. Stand bis 18.08.2026
# nicht hier drin; ein frisches `pip install djangobase` war damit unbenutzbar.
# concurrent-log-handler ist KEINE Kür (Befund 20.08.2026, shortlongx):
# Sobald ein Werkzeug oder ein Management-Command NEBEN dem Server läuft,
# halten zwei Prozesse dieselbe rotierende Logdatei offen — und unter Windows
# kann nur einer sie umbenennen. Ein Testlauf erzeugte so 107 Meldungen
#     PermissionError: [WinError 32] … django.log -> django.log.1
# und verlor dabei Logzeilen. Genau das ist der Normalfall, nicht die Ausnahme:
# Fast jedes Konsumenten-Projekt fährt Skripte neben dem laufenden Server.
dependencies = ["Django>=4.2", "Pillow", "concurrent-log-handler>=0.9.20"]

# OPTIONAL, NICHT PFLICHT (27.08.2026): Die drei Messwerkzeuge hinter
# Hilfe -> Klassenmodell -> Code-Qualitaet. Sie stehen bewusst NICHT in
# `dependencies`: Ohne sie startet nichts falsch, der Bericht meldet
# ordentlich "nicht gelaufen" (umbau/codequalitaet.py setzt `v.fehlt`),
# und ein Projekt, das die Seite nicht nutzt, soll sie nicht mitschleppen.
#
# Warum sie hier trotzdem stehen muessen: Bis heute standen sie NIRGENDS.
# In shortlongx fehlten alle drei, und der Testlauf ergab 29 rote Faelle
# mit Meldungen wie `KeyError: 'arten'` - Meldungen, die wie ein kaputtes
# Projekt aussehen und "pip install fehlt" bedeuten. Ohne einen Ort, an dem
# die Namen stehen, raet jedes Konsumenten-Projekt neu.
#
#     pip install -e "A:/shared/djangoBase[codequalitaet]"
#
# ruff (18.09.2026) gehoert in dasselbe Extra: Hilfe -> Skills -> „ruff" faehrt
# es ueber `sys.executable -m ruff`, also muss es in der Umgebung des PROJEKTS
# stehen, nicht irgendwo im PATH. Die gemeinsamen Regeln liegen in
# `djangobase/ruff_vorgabe.toml` (siehe [tool.ruff] unten).
[project.optional-dependencies]
codequalitaet = ["radon>=6", "pyflakes>=3", "pycodestyle>=2.11", "ruff>=0.6"]
# Hilfe -> Werkzeug Language Server (02.09.2026): beide Werkzeuge, auf der
# Seite umschaltbar; django-types nimmt dem Server die Fehlalarme am Manager.
languageserver = ["basedpyright>=1.19", "pyright>=1.1", "django-types"]

[tool.setuptools]
include-package-data = true

# packages.find erfasst djangobase UND alle Subpakete (views, migrations,
# templatetags, tests). Wichtig fuer nicht-editierbare Installs
# (pip install git+...): mit der alten Liste ["djangobase"] fehlten die
# Subpakete im Wheel -> ImportError djangobase.views.
[tool.setuptools.packages.find]
include = ["djangobase*"]

[tool.setuptools.package-data]
djangobase = ["templates/**/*", "static/**/*", "ruff_vorgabe.toml"]

# djangoBase selbst prueft sich mit derselben Vorgabe, die es den Konsumenten
# gibt — eine Datei, ein Regelsatz. Der Bestand ist seit dem 18.09.2026 danach
# formatiert und frei von Befunden (`ruff check .` und `ruff format --check .`).
[tool.ruff]
extend = "djangobase/ruff_vorgabe.toml"

# `extend-`, sonst ersetzt diese Tabelle die Ausnahmen der Vorgabe (__init__,
# Migrationen, Settings) statt sie zu ergaenzen.
[tool.ruff.lint.extend-per-file-ignores]
# Messprotokoll: Urteile und Beispielantworten der Modelle als Zeichenketten —
# Daten, keine Zeilen zum Umbrechen (29 Zeilen bis 253 Zeichen).
"djangobase/ki/messungen.py" = ["E501"]
