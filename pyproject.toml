[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djangobase"
version = "0.0.1"
description = "Wiederverwendbare Django-Infrastruktur: Hilfe (Versionen/Logs/Tests), Sidebar-Layout, Logging."
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]

[tool.setuptools]
packages = ["djangobase"]
include-package-data = true

[tool.setuptools.package-data]
djangobase = ["templates/**/*", "static/**/*"]
