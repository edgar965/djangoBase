[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djangobase"
version = "0.0.21"
description = "Wiederverwendbare Django-Infrastruktur: Hilfe (Versionen/Logs/Tests/Jobs), Sidebar-Layout (bis 3 Ebenen), Logging."
requires-python = ">=3.10"
# Pillow ist PFLICHT, nicht optional: `Provider.logo` und `Teilnehmer.avatar`
# sind ImageFields, und Django bricht ohne Pillow schon bei `manage.py check`
# ab (fields.E210) - das Projekt startet gar nicht erst. Stand bis 18.08.2026
# nicht hier drin; ein frisches `pip install djangobase` war damit unbenutzbar.
# concurrent-log-handler ist KEINE Kür (Befund 20.08.2026, shortlongx):
# Sobald ein Werkzeug oder ein Management-Command NEBEN dem Server läuft,
# halten zwei Prozesse dieselbe rotierende Logdatei offen — und unter Windows
# kann nur einer sie umbenennen. Ein Testlauf erzeugte so 107 Meldungen
#     PermissionError: [WinError 32] … django.log -> django.log.1
# und verlor dabei Logzeilen. Genau das ist der Normalfall, nicht die Ausnahme:
# Fast jedes Konsumenten-Projekt fährt Skripte neben dem laufenden Server.
dependencies = ["Django>=4.2", "Pillow", "concurrent-log-handler>=0.9.20"]

[tool.setuptools]
include-package-data = true

# packages.find erfasst djangobase UND alle Subpakete (views, migrations,
# templatetags, tests). Wichtig fuer nicht-editierbare Installs
# (pip install git+...): mit der alten Liste ["djangobase"] fehlten die
# Subpakete im Wheel -> ImportError djangobase.views.
[tool.setuptools.packages.find]
include = ["djangobase*"]

[tool.setuptools.package-data]
djangobase = ["templates/**/*", "static/**/*"]
